name: Update ASR papers

on:
  workflow_dispatch:
    inputs:
      update_paper_links:
        description: Only refresh missing code links
        type: boolean
        default: false
  schedule:
    - cron: '0 0,12 * * *'
    - cron: '0 8 * * 1'

concurrency:
  group: asr-paper-updates
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Update papers or code links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_LINKS: ${{ inputs.update_paper_links || github.event.schedule == '0 8 * * 1' }}
        run: |
          if [ "$UPDATE_LINKS" = "true" ]; then
            python daily_arxiv.py --update_paper_links
          else
            python daily_arxiv.py
          fi
      - name: Commit generated files
        run: |
          git config user.name 'skywuxuan'
          git config user.email '1053299807@qq.com'
          git add README.md docs/
          if ! git diff --cached --quiet; then
            git commit -m "Update ASR arXiv papers"
            git pull --rebase origin "${{ github.event.repository.default_branch }}"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi
      - name: Record generated revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  pages:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.update.outputs.revision }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
          build_revision: ${{ needs.update.outputs.revision }}
      - uses: actions/upload-pages-artifact@v3
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
