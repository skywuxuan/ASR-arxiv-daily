name: Check ASR collector

on:
  push:
    paths: ['daily_arxiv.py', 'config.yaml', 'requirements.txt', 'tests/**', '.github/workflows/**']
  pull_request:
    paths: ['daily_arxiv.py', 'config.yaml', 'requirements.txt', 'tests/**', '.github/workflows/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python daily_arxiv.py --render-only
